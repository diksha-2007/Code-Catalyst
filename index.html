<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PWID Care Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <header class="bg-blue-600 text-white p-4 text-center text-2xl font-bold">
    PWID Care Monitoring System
  </header>

  <div class="max-w-7xl mx-auto p-6 grid md:grid-cols-2 gap-6">

    <!-- Patient Info -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-3">Patient Information</h2>
      <input id="patientName" placeholder="Patient Name"
        class="w-full mb-2 p-2 border rounded" />
      <input id="age" type="number" placeholder="Age"
        class="w-full mb-2 p-2 border rounded" />
      <button onclick="savePatient()"
        class="bg-blue-600 text-white px-4 py-2 rounded w-full">
        Save Patient
      </button>
    </div>

    <!-- Behavior Log -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-3">Behavior Log</h2>
      <select id="behavior" class="w-full mb-2 p-2 border rounded">
        <option>Calm</option>
        <option>Aggressive</option>
        <option>Anxious</option>
        <option>Happy</option>
        <option>Withdrawn</option>
      </select>
      <textarea id="behaviorNotes" placeholder="Notes"
        class="w-full mb-2 p-2 border rounded"></textarea>
      <button onclick="addBehavior()"
        class="bg-green-600 text-white px-4 py-2 rounded w-full">
        Add Behavior
      </button>
    </div>

    <!-- Health Log -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-3">Physical Health</h2>
      <input id="weight" type="number" placeholder="Weight (kg)"
        class="w-full mb-2 p-2 border rounded" />
      <input id="temperature" type="number" placeholder="Temperature (°C)"
        class="w-full mb-2 p-2 border rounded" />
      <button onclick="addHealth()"
        class="bg-purple-600 text-white px-4 py-2 rounded w-full">
        Add Health Data
      </button>
    </div>

    <!-- Records -->
    <div class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-3">Records</h2>
      <div id="records" class="space-y-2 text-sm max-h-64 overflow-y-auto"></div>
    </div>

  </div>

  <!-- Charts -->
  <div class="max-w-7xl mx-auto p-6 grid md:grid-cols-3 gap-6">

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2 text-center">Behavior Pattern</h3>
      <canvas id="behaviorChart"></canvas>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2 text-center">Weight Trend</h3>
      <canvas id="weightChart"></canvas>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2 text-center">Temperature Trend</h3>
      <canvas id="tempChart"></canvas>
    </div>

  </div>

<!-- Chatbot -->
<div class="fixed bottom-4 right-4 w-80 bg-white shadow-xl rounded-lg flex flex-col">
  <div class="bg-blue-600 text-white p-3 rounded-t-lg font-semibold">
    Care Assistant 🤖
  </div>

  <div id="chatMessages" class="p-3 h-64 overflow-y-auto text-sm space-y-2"></div>

  <div class="flex border-t">
    <input id="chatInput"
      class="flex-1 p-2 text-sm outline-none"
      placeholder="Ask something..." />
    <button onclick="sendMessage()"
      class="bg-blue-600 text-white px-4">
      Send
    </button>
  </div>
</div>
<script>
  const recordsDiv = document.getElementById("records");

  let behaviorChart, weightChart, tempChart;

  function savePatient() {
    localStorage.setItem("patient",
      JSON.stringify({ name: patientName.value, age: age.value }));
    alert("Patient saved");
  }

  function addBehavior() {
    const data = JSON.parse(localStorage.getItem("data")) || [];
    data.push({
      type: "Behavior",
      value: behavior.value,
      date: new Date().toLocaleDateString()
    });
    localStorage.setItem("data", JSON.stringify(data));
    render();
  }

  function addHealth() {
    const data = JSON.parse(localStorage.getItem("data")) || [];
    data.push({
      type: "Health",
      weight: weight.value,
      temp: temperature.value,
      date: new Date().toLocaleDateString()
    });
    localStorage.setItem("data", JSON.stringify(data));
    render();
  }

  function render() {
    recordsDiv.innerHTML = "";
    const data = JSON.parse(localStorage.getItem("data")) || [];

    data.slice().reverse().forEach(d => {
      recordsDiv.innerHTML += `
        <div class="border p-2 rounded">
          <strong>${d.type}</strong><br>
          ${d.value ? "Behavior: " + d.value : ""}
          ${d.weight ? "Weight: " + d.weight + "kg" : ""}
          ${d.temp ? " | Temp: " + d.temp + "°C" : ""}
          <div class="text-gray-500">${d.date}</div>
        </div>`;
    });

    updateCharts(data);
  }

  function updateCharts(data) {

    // Behavior count
    const behaviorCount = {};
    data.filter(d => d.type === "Behavior")
        .forEach(d => behaviorCount[d.value] = (behaviorCount[d.value] || 0) + 1);

    // Health trends
    const health = data.filter(d => d.type === "Health");
    const dates = health.map(h => h.date);
    const weights = health.map(h => h.weight);
    const temps = health.map(h => h.temp);

    behaviorChart?.destroy();
    weightChart?.destroy();
    tempChart?.destroy();

    behaviorChart = new Chart(behaviorChartCanvas, {
      type: "bar",
      data: {
        labels: Object.keys(behaviorCount),
        datasets: [{
          label: "Frequency",
          data: Object.values(behaviorCount),
          backgroundColor: "rgba(54,162,235,0.7)"
        }]
      }
    });

    weightChart = new Chart(weightChartCanvas, {
      type: "line",
      data: {
        labels: dates,
        datasets: [{
          label: "Weight (kg)",
          data: weights,
          borderColor: "green",
          fill: false
        }]
      }
    });

    tempChart = new Chart(tempChartCanvas, {
      type: "line",
      data: {
        labels: dates,
        datasets: [{
          label: "Temperature (°C)",
          data: temps,
          borderColor: "red",
          fill: false
        }]
      }
    });
  }

  const behaviorChartCanvas = document.getElementById("behaviorChart");
  const weightChartCanvas = document.getElementById("weightChart");
  const tempChartCanvas = document.getElementById("tempChart");
  
  render();
</script>
<script>
const chatMessages = document.getElementById("chatMessages");

function botMessage(text) {
  chatMessages.innerHTML += `
    <div class="bg-gray-200 p-2 rounded w-fit max-w-xs">
      🤖 ${text}
    </div>`;
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function userMessage(text) {
  chatMessages.innerHTML += `
    <div class="bg-blue-100 p-2 rounded ml-auto w-fit max-w-xs">
      🧑 ${text}
    </div>`;
}

function sendMessage(msgFromBtn = null) {
  const inputEl = document.getElementById("chatInput");
  const msg = msgFromBtn || inputEl.value.trim();
  if (!msg) return;

  userMessage(msg);
  inputEl.value = "";

  setTimeout(() => respond(msg.toLowerCase()), 400);
}

function respond(msg) {
  const data = JSON.parse(localStorage.getItem("data")) || [];
  const patient = JSON.parse(localStorage.getItem("patient"));

  /* ---------- GREETING ---------- */
  if (/hi|hello|hey/.test(msg)) {
    botMessage(
      "Hello 👋 I can help you analyze patient behavior and health.<br><br>" +
      quickButtons()
    );
    return;
  }

  /* ---------- PATIENT SUMMARY ---------- */
  if (msg.includes("summary") || msg.includes("overview")) {
    if (!patient) {
      botMessage("No patient profile found.");
      return;
    }

    const behaviors = data.filter(d => d.type === "Behavior");
    const health = data.filter(d => d.type === "Health");

    botMessage(`
      <strong>Patient Summary</strong><br>
      👤 Name: ${patient.name}<br>
      🎂 Age: ${patient.age}<br>
      🧠 Behaviors logged: ${behaviors.length}<br>
      ❤️ Health records: ${health.length}
    `);
    return;
  }

  /* ---------- BEHAVIOR ANALYSIS ---------- */
  if (msg.includes("behavior")) {
    const behaviors = data.filter(d => d.type === "Behavior");
    if (!behaviors.length) {
      botMessage("No behavior data available yet.");
      return;
    }

    const count = {};
    behaviors.forEach(b => count[b.value] = (count[b.value] || 0) + 1);

    const risky = count["Aggressive"] >= 3;

    botMessage(`
      <strong>Behavior Analysis</strong><br>
      ${Object.entries(count).map(([k,v]) => `• ${k}: ${v}`).join("<br>")}
      ${risky ? "<br><br>⚠️ Aggressive behavior appears frequently. Consider identifying triggers." : ""}
    `);
    return;
  }

  /* ---------- HEALTH STATUS ---------- */
  if (msg.includes("health") || msg.includes("temperature") || msg.includes("weight")) {
    const health = data.filter(d => d.type === "Health");
    if (!health.length) {
      botMessage("No health data recorded yet.");
      return;
    }

    const latest = health.at(-1);
    let alerts = [];

    if (latest.temp > 37.5) alerts.push("🌡️ High temperature detected");
    if (health.length > 1) {
      const diff = latest.weight - health.at(-2).weight;
      if (Math.abs(diff) >= 2) alerts.push("⚖️ Sudden weight change");
    }

    botMessage(`
      <strong>Latest Health Status</strong><br>
      ⚖️ Weight: ${latest.weight} kg<br>
      🌡️ Temperature: ${latest.temp} °C
      ${alerts.length ? "<br><br><strong>Alerts:</strong><br>" + alerts.join("<br>") : "<br><br>✅ No immediate risks detected"}
    `);
    return;
  }

  /* ---------- LAST RECORD ---------- */
  if (msg.includes("last") || msg.includes("recent")) {
    if (!data.length) {
      botMessage("No records found.");
      return;
    }

    const last = data.at(-1);
    botMessage(`
      <strong>Most Recent Entry</strong><br>
      📅 ${last.date}<br>
      ${last.type === "Behavior"
        ? `🧠 Behavior: ${last.value}`
        : `⚖️ Weight: ${last.weight} kg<br>🌡️ Temp: ${last.temp} °C`}
    `);
    return;
  }

  /* ---------- HELP ---------- */
  if (msg.includes("help")) {
    botMessage(
      "You can ask me things like:<br>" +
      "• Patient summary<br>" +
      "• Behavior analysis<br>" +
      "• Health status<br>" +
      "• Last record"
    );
    return;
  }

  /* ---------- FALLBACK ---------- */
  botMessage(
    "I didn’t fully understand that 🤔<br>" +
    "Try asking for a summary, behavior analysis, or health status."
  );
}

function quickButtons() {
  return `
    <div class="mt-2 space-y-1">
      <button onclick="sendMessage('patient summary')" class="text-xs bg-blue-100 px-2 py-1 rounded">Patient Summary</button>
      <button onclick="sendMessage('behavior analysis')" class="text-xs bg-blue-100 px-2 py-1 rounded">Behavior</button>
      <button onclick="sendMessage('health status')" class="text-xs bg-blue-100 px-2 py-1 rounded">Health</button>
      <button onclick="sendMessage('last record')" class="text-xs bg-blue-100 px-2 py-1 rounded">Last Entry</button>
    </div>
  `;
}

botMessage("Hello! I’m your PWID Care Assistant 🤖<br>" + quickButtons());
</script>


</body>
</html>
